<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de clientes — Pehuenia</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root{
    --a:#16a34a; --b:#2563eb; --c:#f59e0b; --d:#dc2626; --sin:#64748b;
    --panel:#ffffff; --borde:#e2e8f0; --texto:#0f172a; --muted:#64748b; --fondo:#f1f5f9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;font-family:system-ui,Segoe UI,Roboto,sans-serif;color:var(--texto)}
  #map{position:absolute;inset:0 0 0 340px;background:#dde5ec}
  #panel{position:absolute;inset:0 auto 0 0;width:340px;background:var(--panel);border-right:1px solid var(--borde);
    display:flex;flex-direction:column;z-index:1000;overflow:hidden}
  #panel header{padding:12px 14px 8px;border-bottom:1px solid var(--borde)}
  #panel h1{margin:0;font-size:16px}
  #contador{font-size:13px;color:var(--muted);margin-top:4px}
  #contador b{color:var(--texto);font-size:15px}
  #filtros{flex:1;overflow-y:auto;padding:10px 14px 20px}
  .seccion{margin-bottom:14px}
  .seccion h2{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;align-items:center}
  .seccion h2 .limpiar{font-size:10px;color:#2563eb;cursor:pointer;text-transform:none;letter-spacing:0;display:none}
  .seccion.activa h2 .limpiar{display:inline}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{border:1.5px solid var(--borde);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;user-select:none;
    background:#fff;display:flex;align-items:center;gap:5px;transition:all .1s}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .chip .n{color:var(--muted);font-size:11px}
  .chip.on{border-color:var(--texto);background:var(--texto);color:#fff}
  .chip.on .n{color:#cbd5e1}
  .buscador{width:100%;border:1px solid var(--borde);border-radius:8px;padding:6px 9px;font-size:13px;margin-bottom:6px;outline:none}
  .buscador:focus{border-color:#94a3b8}
  .lista{max-height:180px;overflow-y:auto;border:1px solid var(--borde);border-radius:8px}
  .lista label{display:flex;align-items:center;gap:7px;padding:4px 9px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f1f5f9}
  .lista label:last-child{border-bottom:none}
  .lista label:hover{background:#f8fafc}
  .lista label .n{margin-left:auto;color:var(--muted);font-size:11px}
  .lista input{margin:0}
  #busqCli{position:relative}
  #resultados{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--borde);border-radius:8px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);z-index:1200;max-height:260px;overflow-y:auto;display:none}
  #resultados div{padding:6px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid #f1f5f9}
  #resultados div:hover{background:#f0f6ff}
  #resultados .cod{color:var(--muted)}
  #resultados .singeo{color:#b91c1c;font-size:10.5px}
  .botones{display:flex;gap:6px;margin:2px 0 12px}
  .btn{flex:1;border:1px solid var(--borde);background:#fff;border-radius:8px;padding:6px 8px;font-size:12px;cursor:pointer}
  .btn:hover{background:#f8fafc}
  .toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:12px;cursor:pointer}
  #pie{padding:8px 14px;border-top:1px solid var(--borde);font-size:11px;color:var(--muted)}
  #pie details{margin-top:4px}
  #pie summary{cursor:pointer;color:#b91c1c}
  #listaSinGeo{max-height:160px;overflow-y:auto;margin-top:4px;font-size:11px}
  #listaSinGeo div{padding:2px 0;border-bottom:1px solid #f1f5f9}
  /* popup */
  .pop{font-size:12.5px;line-height:1.45}
  .pop .nom{font-weight:700;font-size:13.5px;margin-bottom:2px}
  .pop .seg{display:inline-block;border-radius:4px;color:#fff;padding:0 6px;font-weight:700;font-size:11.5px}
  .pop .ruta{margin-top:4px;padding-top:4px;border-top:1px dashed var(--borde)}
  .pop a{color:#2563eb}
  .leaflet-popup-content{margin:10px 14px}
  /* boton panel móvil */
  #btnPanel{display:none;position:absolute;top:10px;left:10px;z-index:1100;background:#fff;border:1px solid var(--borde);
    border-radius:8px;padding:8px 11px;font-size:15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  @media (max-width:720px){
    #map{inset:0}
    #panel{width:min(86vw,340px);transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.2)}
    #panel.abierto{transform:none}
    #btnPanel{display:block}
  }
</style>
</head>
<body>
<div id="btnPanel">☰ Filtros</div>
<div id="panel">
  <header>
    <h1>🗺️ Mapa de clientes</h1>
    <div id="contador"></div>
  </header>
  <div id="filtros">
    <div class="seccion" id="secBusq">
      <h2>Buscar cliente</h2>
      <div id="busqCli">
        <input class="buscador" id="inpCli" placeholder="Código o nombre…" autocomplete="off">
        <div id="resultados"></div>
      </div>
    </div>
    <div class="botones">
      <button class="btn" id="btnEncuadrar">🎯 Encuadrar filtrados</button>
      <button class="btn" id="btnLimpiar">✕ Limpiar filtros</button>
    </div>
    <label class="toggle"><input type="checkbox" id="chkCluster"> Agrupar puntos cercanos</label>
    <div class="seccion" id="secSeg">
      <h2>Taxonomía <span class="limpiar">limpiar</span></h2>
      <div class="chips" id="chipsSeg"></div>
    </div>
    <div class="seccion" id="secFrec">
      <h2>Frecuencia de visita <span class="limpiar">limpiar</span></h2>
      <div class="chips" id="chipsFrec"></div>
    </div>
    <div class="seccion" id="secDia">
      <h2>Día de visita <span class="limpiar">limpiar</span></h2>
      <div class="chips" id="chipsDia"></div>
      <label class="toggle" style="margin:9px 0 0"><input type="checkbox" id="chkSemana"> <b>Ciclo real:</b>&nbsp;solo clientes con visita en la semana de…</label>
      <input type="date" class="buscador" id="inpSemana" style="margin-top:5px">
      <div id="lblSemana" style="font-size:11px;color:var(--muted);margin-top:2px"></div>
    </div>
    <div class="seccion" id="secLoc">
      <h2>Localidad <span class="limpiar">limpiar</span></h2>
      <input class="buscador" id="inpLoc" placeholder="Filtrar localidades…">
      <div class="lista" id="listaLoc"></div>
    </div>
    <div class="seccion" id="secSup">
      <h2>Supervisor <span class="limpiar">limpiar</span></h2>
      <div class="chips" id="chipsSup"></div>
    </div>
    <div class="seccion" id="secVend">
      <h2>Vendedor <span class="limpiar">limpiar</span></h2>
      <input class="buscador" id="inpVend" placeholder="Filtrar vendedores…">
      <div class="lista" id="listaVend"></div>
    </div>
  </div>
  <div id="pie">
    Datos: Gescom · generado <span id="genFecha"></span>
    <details id="detSinGeo">
      <summary></summary>
      <div id="listaSinGeo"></div>
    </details>
  </div>
</div>
<div id="map"></div>

const COLORES = {A:'#16a34a', B:'#2563eb', C:'#f59e0b', D:'#dc2626', SIN:'#64748b'};
const SEG_DESC = {A:'A — facturación ≥200% del prom.', B:'B — 130–199%', C:'C — 66–129%', D:'D — <65%', SIN:'Sin taxonomía'};
const DIAS = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const DIAS_LARGO = ['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const FREC_LABEL = {Semanal:'Semanal', Cada2Semanas:'Cada 2 sem.', Cada4Semanas:'Cada 4 sem.', Eventual:'Eventual', SINRUTA:'Sin ruta'};

// ---- estado de filtros (set vacío = sin filtro) ----
const sel = {seg:new Set(), frec:new Set(), dia:new Set(), loc:new Set(), sup:new Set(), vend:new Set()};
// supervisor de un vendedor (índice en P.sups); el build lo deriva de las carteras vigentes
const supDe = v => P.vendSup[v] ?? (P.sups.length - 1);

// ---- preproceso de clientes ----
// P.clientes: [codigo, nombre, direccion, locIdx, lat, lng, seg, rutas[[vend, diasMask, frecIdx]]]
// lunes (12:00 UTC) de la semana de un timestamp — base para comparar ciclos
const lunesDe = ms => { const d = new Date(ms); return ms - ((d.getUTCDay()+6)%7) * 86400000; };
const SEMANA_MS = 7 * 86400000;

const clientes = P.clientes.map(c => {
  const rutas = c[7] || [];
  const frecs = new Set(rutas.length ? rutas.map(r => P.frecs[r[2]]) : ['SINRUTA']);
  let diasMask = 0; const vends = new Set(), sups = new Set();
  for (const r of rutas){
    diasMask |= r[1]; vends.add(r[0]); sups.add(supDe(r[0]));
    // ciclo en semanas y lunes de la semana de anclaje (fechaPrimeraVisita)
    const f = P.frecs[r[2]];
    r.ciclo = f === 'Cada2Semanas' ? 2 : f === 'Cada4Semanas' ? 4 : 1;
    r.ancMon = r[3] ? lunesDe(Date.parse(r[3] + 'T12:00:00Z')) : null;
  }
  return {cod:String(c[0]), nom:c[1], dir:c[2], loc:c[3], lat:c[4], lng:c[5], seg:c[6],
          rutas, frecs, diasMask, vends, sups, maskSemana:0, marker:null, visible:true};
});
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
for (const c of clientes) c.busq = norm(c.cod + ' ' + c.nom);

// ---- mapa ----
const map = L.map('map', {preferCanvas:true, zoomControl:true});
map.fitBounds(P.bounds, {padding:[20,20]});
// si el contenedor no tenía tamaño al iniciar (pestaña oculta), reencuadrar cuando lo tenga
let encuadrado = map.getSize().x > 50;
new ResizeObserver(() => {
  map.invalidateSize();
  if (!encuadrado && map.getSize().x > 50){ encuadrado = true; map.fitBounds(P.bounds, {padding:[20,20]}); }
}).observe(document.getElementById('map'));
setTimeout(() => { if (!encuadrado && map.getSize().x > 50){ encuadrado = true; map.invalidateSize(); map.fitBounds(P.bounds, {padding:[20,20]}); } }, 400);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
L.control.scale({imperial:false}).addTo(map);

const clusterGroup = L.markerClusterGroup({chunkedLoading:true, disableClusteringAtZoom:16, maxClusterRadius:55, spiderfyOnMaxZoom:false, showCoverageOnHover:false});
const planoGroup = L.layerGroup();
let usarCluster = false; // puntos siempre visibles por defecto

// radio del punto según zoom, para que no se pisen al ver toda la zona
const radioPorZoom = z => z >= 15 ? 7 : z >= 13 ? 5.5 : z >= 11 ? 4 : 3;
map.on('zoomend', () => {
  const r = radioPorZoom(map.getZoom());
  for (const c of clientes) c.marker.setRadius(r);
});

function popupHtml(c){
  let h = `<div class="pop"><div class="nom">${esc(c.nom)}</div>`;
  h += `<span class="seg" style="background:${COLORES[c.seg]}" title="${SEG_DESC[c.seg]}">${c.seg==='SIN'?'Sin tax.':'Taxonomía '+c.seg}</span> `;
  h += `<span style="color:#64748b">· Cód. ${c.cod}</span><br>`;
  h += `${esc(c.dir||'—')}<br><b>${esc(P.locs[c.loc][0])}</b>`;
  if (!c.rutas.length) h += `<div class="ruta">Sin ruta de preventa asignada</div>`;
  for (const r of c.rutas){
    const dias = DIAS_LARGO.filter((_,i)=> r[1] & (1<<i)).join(', ');
    let sem = '';
    if (modoSemana() && r.ciclo > 1 && r.ancMon !== null)
      sem = rutaActiva(r) ? ' <b style="color:#16a34a">· visita esta semana ✓</b>' : ' <b style="color:#b91c1c">· salta esta semana</b>';
    h += `<div class="ruta">👤 <b>${esc(P.vends[r[0]]||('Vend. '+r[0]))}</b> (${r[0]})` +
         ` <span style="color:#64748b">· ${esc(P.sups[supDe(r[0])])}</span><br>` +
         `📅 ${dias||'—'} · ${FREC_LABEL[P.frecs[r[2]]]||P.frecs[r[2]]}${sem}` +
         (r[3] ? `<br>⚓ Anclaje: ${r[3].split('-').reverse().join('/')}` : '') + `</div>`;
  }
  h += `<div class="ruta"><a href="https://www.google.com/maps?q=${c.lat},${c.lng}" target="_blank">Abrir en Google Maps ↗</a></div></div>`;
  return h;
}
const esc = s => String(s??'').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

for (const c of clientes){
  c.marker = L.circleMarker([c.lat, c.lng], {
    radius:4, weight:1, color:'#ffffff', fillColor:COLORES[c.seg], fillOpacity:.88
  }).bindPopup(() => popupHtml(c), {maxWidth:300});
}

// ---- ciclo real de la semana elegida ----
let lunesSel = null; // lunes de la semana seleccionada (ms), null = modo apagado
const modoSemana = () => document.getElementById('chkSemana').checked && lunesSel !== null;
// una ruta está activa en la semana elegida si es semanal, o si la cantidad de semanas
// desde su anclaje es múltiplo del ciclo (2 o 4); sin anclaje conocido = siempre activa
const rutaActiva = r => r.ciclo === 1 || r.ancMon === null ||
  ((Math.round((lunesSel - r.ancMon) / SEMANA_MS) % r.ciclo) + r.ciclo) % r.ciclo === 0;
function recalcSemana(){
  const v = document.getElementById('inpSemana').value;
  lunesSel = v ? lunesDe(Date.parse(v + 'T12:00:00Z')) : null;
  const lbl = document.getElementById('lblSemana');
  if (lunesSel !== null){
    const fin = new Date(lunesSel + 6*86400000), ini = new Date(lunesSel);
    const f = d => `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}`;
    lbl.textContent = `Semana lun ${f(ini)} → dom ${f(fin)} · quincenales y mensuales según su anclaje`;
  } else lbl.textContent = '';
  if (!modoSemana()) return;
  for (const c of clientes){
    let m = 0;
    for (const r of c.rutas) if (rutaActiva(r)) m |= r[1];
    c.maskSemana = m;
  }
}

// ---- lógica de filtrado ----
let MODO = false; // cache de modoSemana() para no leer el DOM en el loop caliente
function pasa(c, omitir){
  if (omitir!=='seg'  && sel.seg.size  && !sel.seg.has(c.seg)) return false;
  if (omitir!=='frec' && sel.frec.size && ![...c.frecs].some(f => sel.frec.has(f))) return false;
  const mDias = MODO ? c.maskSemana : c.diasMask;
  if (MODO && !mDias) return false; // sin visita real esa semana
  if (omitir!=='dia'  && sel.dia.size  && ![...sel.dia].some(d => mDias & (1<<d))) return false;
  if (omitir!=='loc'  && sel.loc.size  && !sel.loc.has(c.loc)) return false;
  if (omitir!=='sup'  && sel.sup.size  && ![...c.sups].some(s => sel.sup.has(s))) return false;
  if (omitir!=='vend' && sel.vend.size && ![...c.vends].some(v => sel.vend.has(v))) return false;
  return true;
}

let tmr = null;
function aplicar(){ clearTimeout(tmr); tmr = setTimeout(aplicarAhora, 30); }
function aplicarAhora(){
  recalcSemana();
  MODO = modoSemana();
  const visibles = [];
  for (const c of clientes){ c.visible = pasa(c); if (c.visible) visibles.push(c.marker); }
  clusterGroup.clearLayers(); planoGroup.clearLayers();
  map.removeLayer(clusterGroup); map.removeLayer(planoGroup);
  if (usarCluster){ clusterGroup.addLayers(visibles); map.addLayer(clusterGroup); }
  else { visibles.forEach(m => planoGroup.addLayer(m)); map.addLayer(planoGroup); }
  refrescarContadores();
}

function refrescarContadores(){
  const n = clientes.filter(c => c.visible).length;
  document.getElementById('contador').innerHTML =
    `<b>${fmt(n)}</b> de ${fmt(clientes.length)} clientes en el mapa` +
    (P.singeo.length ? ` · <span style="color:#b91c1c">${fmt(P.singeo.length)} sin geo</span>` : '');
  // contadores facetados por opción
  for (const [grupo, omitir] of [['seg','seg'],['frec','frec'],['dia','dia'],['sup','sup']]){
    document.querySelectorAll(`[data-g="${grupo}"]`).forEach(el => {
      const v = el.dataset.v;
      let cnt = 0;
      for (const c of clientes){
        if (!pasa(c, omitir)) continue;
        if (grupo==='seg' && c.seg===v) cnt++;
        else if (grupo==='frec' && c.frecs.has(v)) cnt++;
        else if (grupo==='dia' && ((MODO?c.maskSemana:c.diasMask) & (1<<+v))) cnt++;
        else if (grupo==='sup' && c.sups.has(+v)) cnt++;
      }
      el.querySelector('.n').textContent = fmt(cnt);
    });
  }
  for (const grupo of ['loc','vend']){
    document.querySelectorAll(`[data-g="${grupo}"] .n`).forEach(el => {
      const v = el.parentElement.dataset.v;
      let cnt = 0;
      for (const c of clientes){
        if (!pasa(c, grupo)) continue;
        if (grupo==='loc' && c.loc===+v) cnt++;
        else if (grupo==='vend' && c.vends.has(v)) cnt++;
      }
      el.textContent = fmt(cnt);
    });
  }
  for (const [g, id] of [['seg','secSeg'],['frec','secFrec'],['dia','secDia'],['loc','secLoc'],['sup','secSup'],['vend','secVend']])
    document.getElementById(id).classList.toggle('activa', sel[g].size > 0 || (id==='secDia' && modoSemana()));
}
const fmt = n => n.toLocaleString('es-AR');

// ---- construcción de controles ----
function chip(grupo, valor, texto, color){
  const d = document.createElement('div');
  d.className = 'chip'; d.dataset.g = grupo; d.dataset.v = valor;
  d.innerHTML = (color?`<span class="dot" style="background:${color}"></span>`:'') + `<span>${texto}</span> <span class="n"></span>`;
  if (grupo==='seg') d.title = SEG_DESC[valor];
  d.onclick = () => { togg(sel[grupo], valor); d.classList.toggle('on'); aplicar(); };
  return d;
}
function togg(set, v){ set.has(v) ? set.delete(v) : set.add(v); }

const cs = document.getElementById('chipsSeg');
for (const s of P.segs) cs.appendChild(chip('seg', s, s==='SIN'?'Sin tax.':s, COLORES[s]));

const cf = document.getElementById('chipsFrec');
for (const f of [...P.frecs, 'SINRUTA']) cf.appendChild(chip('frec', f, FREC_LABEL[f]||f));

const cd = document.getElementById('chipsDia');
DIAS.forEach((d,i) => {
  const el = chip('dia', String(i), d);
  el.onclick = () => { togg(sel.dia, i); el.classList.toggle('on'); aplicar(); };
  cd.appendChild(el);
});

// supervisor: chips. Al elegir uno, la lista de vendedores se recorta a su equipo
// (y se destildan los que quedaron fuera, para que el conteo no mienta).
const COL_SUP = ['#0891b2','#7c3aed','#db2777','#64748b'];
const cSup = document.getElementById('chipsSup');
P.sups.forEach((nom, i) => {
  const el = chip('sup', String(i), nom, COL_SUP[i] || '#64748b');
  el.onclick = () => {
    togg(sel.sup, i); el.classList.toggle('on');
    for (const v of [...sel.vend]) if (sel.sup.size && !sel.sup.has(supDe(v))) sel.vend.delete(v);
    document.querySelectorAll('#listaVend input[type=checkbox]').forEach(chk => {
      chk.checked = sel.vend.has(String(chk.parentElement.dataset.v));
    });
    filtrarListaVend();
    aplicar();
  };
  cSup.appendChild(el);
});
// muestra en la lista de vendedores solo los del supervisor elegido que además matcheen la búsqueda
function filtrarListaVend(){
  const q = norm(document.getElementById('inpVend').value || '');
  document.querySelectorAll('#listaVend label').forEach(l => {
    const enScope = !sel.sup.size || sel.sup.has(supDe(String(l.dataset.v)));
    l.style.display = (enScope && l.dataset.busq.includes(q)) ? '' : 'none';
  });
}

function armarLista(idLista, idInp, grupo, items){ // items: [[valor, texto, total]]
  const cont = document.getElementById(idLista);
  for (const [v, txt, tot] of items){
    const lab = document.createElement('label');
    lab.dataset.g = grupo; lab.dataset.v = v; lab.dataset.busq = norm(txt);
    lab.innerHTML = `<input type="checkbox"> <span>${esc(txt)}</span> <span class="n">${fmt(tot)}</span>`;
    lab.querySelector('input').onchange = e => {
      togg(sel[grupo], grupo==='loc'?+v:String(v)); aplicar();
    };
    cont.appendChild(lab);
  }
  document.getElementById(idInp).oninput = e => {
    const q = norm(e.target.value);
    cont.querySelectorAll('label').forEach(l => l.style.display = l.dataset.busq.includes(q)?'':'none');
  };
}
armarLista('listaLoc','inpLoc','loc', P.locs.map(([txt,tot],i)=>[i,txt,tot]));
armarLista('listaVend','inpVend','vend', P.vendsOrden.map(v => [v, `${v} — ${P.vends[v]||'?'}`, clientes.filter(c=>c.vends.has(v)).length]));
document.getElementById('inpVend').oninput = filtrarListaVend; // respeta también el supervisor elegido

// limpiar por sección y global
document.querySelectorAll('.seccion .limpiar').forEach(el => el.onclick = () => {
  const id = el.closest('.seccion').id;
  const g = {secSeg:'seg',secFrec:'frec',secDia:'dia',secLoc:'loc',secSup:'sup',secVend:'vend'}[id];
  sel[g].clear();
  el.closest('.seccion').querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  el.closest('.seccion').querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
  if (g==='sup') filtrarListaVend(); // vuelve a mostrar todos los vendedores
  aplicar();
});
document.getElementById('btnLimpiar').onclick = () => {
  for (const k in sel) sel[k].clear();
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));
  document.querySelectorAll('.lista input[type=checkbox]').forEach(c=>c.checked=false);
  document.getElementById('chkSemana').checked = false;
  filtrarListaVend();
  aplicar();
};
document.getElementById('btnEncuadrar').onclick = () => {
  const pts = clientes.filter(c=>c.visible).map(c=>[c.lat,c.lng]);
  if (pts.length) map.fitBounds(L.latLngBounds(pts), {padding:[30,30], maxZoom:16});
};
document.getElementById('chkCluster').onchange = e => { usarCluster = e.target.checked; aplicarAhora(); };

// selector de semana (ciclo real)
{
  const hoy = new Date(), pad = n => String(n).padStart(2,'0');
  document.getElementById('inpSemana').value = `${hoy.getFullYear()}-${pad(hoy.getMonth()+1)}-${pad(hoy.getDate())}`;
}
document.getElementById('chkSemana').onchange = () => aplicar();
document.getElementById('inpSemana').onchange = () => { document.getElementById('chkSemana').checked = true; aplicar(); };

// ---- buscador de clientes ----
const inpCli = document.getElementById('inpCli'), resBox = document.getElementById('resultados');
inpCli.oninput = () => {
  const q = norm(inpCli.value.trim());
  if (q.length < 2){ resBox.style.display='none'; return; }
  const hits = [];
  for (const c of clientes){ if (c.busq.includes(q)){ hits.push(c); if (hits.length>=12) break; } }
  const hitsSin = P.singeo.filter(s => norm(s[0]+' '+s[1]).includes(q)).slice(0, 12-hits.length);
  resBox.innerHTML = hits.map((c,i)=>`<div data-i="${clientes.indexOf(c)}"><span class="cod">${c.cod}</span> ${esc(c.nom)}</div>`).join('') +
    hitsSin.map(s=>`<div><span class="cod">${s[0]}</span> ${esc(s[1])} <span class="singeo">— sin coordenadas (${esc(s[2])})</span></div>`).join('');
  resBox.style.display = (hits.length+hitsSin.length) ? 'block' : 'none';
  resBox.querySelectorAll('div[data-i]').forEach(el => el.onclick = () => {
    const c = clientes[+el.dataset.i];
    resBox.style.display='none'; inpCli.value = c.nom.trim();
    document.getElementById('panel').classList.remove('abierto');
    map.setView([c.lat,c.lng], 17);
    setTimeout(()=>c.marker.openPopup(), 350);
  });
};
document.addEventListener('click', e => { if (!e.target.closest('#busqCli')) resBox.style.display='none'; });

// ---- pie: sin geo ----
document.getElementById('genFecha').textContent = P.gen;
if (P.singeo.length){
  document.querySelector('#detSinGeo summary').textContent = `${fmt(P.singeo.length)} clientes sin coordenadas válidas`;
  document.getElementById('listaSinGeo').innerHTML =
    P.singeo.map(s=>`<div><b>${s[0]}</b> ${esc(s[1])} · ${esc(s[2])}</div>`).join('');
} else document.getElementById('detSinGeo').style.display='none';

// ---- panel móvil ----
document.getElementById('btnPanel').onclick = () => document.getElementById('panel').classList.toggle('abierto');

aplicarAhora();
map.whenReady(() => { const r = radioPorZoom(map.getZoom()); for (const c of clientes) c.marker.setRadius(r); });
</script>
